name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kidos_admin
          POSTGRES_PASSWORD: kidos_dev
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U kidos_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgres://kidos_admin:kidos_dev@localhost:5433/postgres
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - name: Dependency audit
        run: pnpm audit --audit-level high
      - name: Production build of the API (bundle and migrations)
        run: pnpm run build:api
      - name: Backup and restore drill (data, migrations, tenant isolation and audit log survive a restore)
        run: pnpm run drill:backup

  e2e:
    # Browser end-to-end tests: starts its own embedded database, API and production web build, and drives Chrome.
    runs-on: ubuntu-latest
    needs: verify
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts
          path: apps/web/test-results
          retention-days: 7
